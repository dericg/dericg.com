name: Publish first writing post

on:
  push:
    paths:
      - .github/workflows/publish-writing-post.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Add writing section and post
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          post = '''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <meta name="description" content="What I’m working on this week: finishing the outbound communication loop in a reconciliation application." />
            <title>What I’m Working On This Week — Deric Garza</title>
            <style>
              :root{--bg:#090c11;--surface:#10151d;--text:#f3f5f7;--muted:#98a4b4;--line:#242e3b;--accent:#d8aa70;--blue:#8bb8ff;--max:760px}
              *{box-sizing:border-box}
              body{margin:0;color:var(--text);line-height:1.75;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% -5%,rgba(139,184,255,.07),transparent 27%),var(--bg)}
              a{color:inherit;text-decoration:none}
              .wrap{width:min(calc(100% - 40px),var(--max));margin:auto}
              header{border-bottom:1px solid var(--line)}
              nav{height:66px;display:flex;align-items:center;justify-content:space-between;gap:20px}
              .brand{font-weight:800;letter-spacing:-.02em}
              .back{font-size:14px;color:var(--muted)}
              main{padding:78px 0 96px}
              .eyebrow{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:850;margin-bottom:18px}
              h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(44px,7vw,72px);letter-spacing:-.045em;line-height:1.02;margin:0 0 20px}
              .meta{color:var(--muted);font-size:14px;margin-bottom:52px}
              article p{font-size:18px;color:#d9dee6;margin:0 0 26px}
              code{font-size:.9em;background:var(--surface);border:1px solid var(--line);padding:2px 6px;border-radius:6px;color:#dce5ef}
              .closing{margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
              footer{border-top:1px solid var(--line);padding:28px 0 42px;color:var(--muted);font-size:12px}
              @media(max-width:560px){.wrap{width:min(calc(100% - 28px),var(--max));margin:auto}main{padding-top:58px}article p{font-size:17px}}
            </style>
          </head>
          <body>
            <header><div class="wrap"><nav><a class="brand" href="/">Deric Garza</a><a class="back" href="/writing/">Writing</a></nav></div></header>
            <main>
              <div class="wrap">
                <div class="eyebrow">Working note</div>
                <h1>What I’m Working On This Week</h1>
                <div class="meta">October 25, 2026</div>
                <article>
                  <p>This week I’m working on a reconciliation app that helps manage the messy parts of a recurring business review process.</p>

                  <p>The basic problem is pretty common: information lives in several places, some of it doesn’t line up, and somebody has to figure out what still needs attention. That can mean a missing credit, an unmatched payment, something waiting for approval, or an issue that was still open from the previous week.</p>

                  <p>The app is meant to keep those exceptions organized from the moment they’re identified until they’re resolved.</p>

                  <p>One part of that workflow is communication. Once the open items have been reviewed, someone prepares the client-facing report and message. That communication then needs to be reviewed internally, changed if necessary, approved, and eventually sent.</p>

                  <p>A lot of that process used to happen through email. Someone would prepare the draft, send it over for review, make changes, and then send the final version.</p>

                  <p>I’ve been moving that into the application so the review process has a proper history. If someone reviews Version 1 and asks for changes, Version 1 stays exactly as it was. A new version gets created. If Version 3 is eventually approved, the system preserves exactly what was in Version 3 when that approval happened.</p>

                  <p>This week I’m focused on finishing the outbound side of that workflow.</p>

                  <p>The app can already send review notifications and send an approved communication through an email provider. What I’m working on now is making sure the delivery record is accurate all the way through.</p>

                  <p>For example, there’s a difference between handing an email to the provider and knowing the receiving mail server actually accepted it. I want the app to reflect that difference correctly, so a communication moves from <code>SUBMITTED</code> to <code>DELIVERED</code> only when there’s real evidence that delivery happened.</p>

                  <p>I’m also making sure the same approved version can’t accidentally be sent twice. That matters for obvious reasons, especially if someone double-clicks a button, refreshes the page, or retries after a slow response.</p>

                  <p>The larger goal is to make the outbound workflow something I can trust from end to end: prepare the communication, review the exact version, approve it, send it, confirm delivery, and preserve the record of what happened.</p>

                  <p>If I get that finished this week, I’ll be ready to move on to the next parts of the app, including improving the actual report artifact and bringing client responses back into the same workflow.</p>

                  <p class="closing">For now, I’m trying to get one path working cleanly from start to finish.</p>
                </article>
              </div>
            </main>
            <footer><div class="wrap">Deric Garza · A work in progress.</div></footer>
          </body>
          </html>
          '''

          writing_index = '''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <meta name="description" content="Writing and working notes from Deric Garza." />
            <title>Writing — Deric Garza</title>
            <style>
              :root{--bg:#090c11;--surface:#10151d;--text:#f3f5f7;--muted:#98a4b4;--line:#242e3b;--accent:#d8aa70;--max:900px}
              *{box-sizing:border-box}body{margin:0;color:var(--text);line-height:1.65;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg)}a{color:inherit;text-decoration:none}.wrap{width:min(calc(100% - 40px),var(--max));margin:auto}header{border-bottom:1px solid var(--line)}nav{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800}.back{font-size:14px;color:var(--muted)}main{padding:82px 0 100px}.kicker{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:850}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,7vw,76px);font-weight:500;letter-spacing:-.045em;line-height:1;margin:14px 0 48px}.post{display:block;border-top:1px solid var(--line);padding:28px 0}.post time{font-size:12px;color:var(--muted)}.post h2{font-size:28px;letter-spacing:-.03em;margin:8px 0}.post p{color:var(--muted);margin:0;max-width:720px}.post:hover h2{color:var(--accent)}footer{border-top:1px solid var(--line);padding:28px 0 42px;color:var(--muted);font-size:12px}@media(max-width:560px){.wrap{width:min(calc(100% - 28px),var(--max));margin:auto}}
            </style>
          </head>
          <body>
            <header><div class="wrap"><nav><a class="brand" href="/">Deric Garza</a><a class="back" href="/">Home</a></nav></div></header>
            <main><div class="wrap"><div class="kicker">Writing</div><h1>Notes from the work.</h1><a class="post" href="/writing/what-im-working-on-this-week/"><time datetime="2026-10-25">October 25, 2026</time><h2>What I’m Working On This Week</h2><p>Finishing the outbound communication loop in a reconciliation application, including versioned review, delivery confirmation, and duplicate-send protection.</p></a></div></main>
            <footer><div class="wrap">Deric Garza · A work in progress.</div></footer>
          </body>
          </html>
          '''

          Path('writing/what-im-working-on-this-week').mkdir(parents=True, exist_ok=True)
          Path('writing/what-im-working-on-this-week/index.html').write_text(post, encoding='utf-8')
          Path('writing').mkdir(exist_ok=True)
          Path('writing/index.html').write_text(writing_index, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          if 'id="writing"' not in index:
              css_anchor = '    .now-card{display:grid;grid-template-columns:1fr 340px;gap:40px;border:1px solid var(--line);border-radius:var(--radius);padding:28px;background:linear-gradient(135deg,rgba(216,170,112,.055),rgba(139,184,255,.03))}'
              writing_css = '''    .writing-card{display:grid;grid-template-columns:150px 1fr auto;gap:24px;align-items:start;border-top:1px solid var(--line);padding:24px 0}\n    .writing-card time{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}\n    .writing-card h3{font-size:26px;margin:0 0 8px}\n    .writing-card p{color:var(--muted);margin:0;max-width:680px}\n    .writing-card .read{color:var(--blue);font-size:13px;font-weight:750;white-space:nowrap}\n\n'''
              if css_anchor not in index:
                  raise SystemExit('Could not find CSS insertion anchor')
              index = index.replace(css_anchor, writing_css + css_anchor, 1)

              mobile_anchor = '      .principles,.os{grid-template-columns:1fr}'
              if mobile_anchor not in index:
                  raise SystemExit('Could not find mobile CSS insertion anchor')
              index = index.replace(mobile_anchor, mobile_anchor + '\n      .writing-card{grid-template-columns:1fr;gap:8px}', 1)

              nav_anchor = '        <a href="#now">Now</a>'
              if nav_anchor not in index:
                  raise SystemExit('Could not find nav insertion anchor')
              index = index.replace(nav_anchor, '        <a href="#writing">Writing</a>\n' + nav_anchor, 1)

              section_anchor = '    <section id="now">'
              writing_section = '''    <section id="writing">\n      <div class="wrap">\n        <div class="section-head">\n          <div class="kicker">Writing</div>\n          <div><h2>Notes from the work.</h2><p class="intro">What I’m building, what I’m learning, and the problems I’m trying to understand more clearly.</p></div>\n        </div>\n        <a class="writing-card" href="/writing/what-im-working-on-this-week/">\n          <time datetime="2026-10-25">Oct. 25, 2026</time>\n          <div><h3>What I’m Working On This Week</h3><p>Finishing the outbound communication loop in a reconciliation application: versioned review, delivery confirmation, and duplicate-send protection.</p></div>\n          <span class="read">Read →</span>\n        </a>\n      </div>\n    </section>\n\n'''
              if section_anchor not in index:
                  raise SystemExit('Could not find section insertion anchor')
              index = index.replace(section_anchor, writing_section + section_anchor, 1)
              index_path.write_text(index, encoding='utf-8')

          build_path = Path('scripts/build-site.sh')
          build = build_path.read_text(encoding='utf-8')
          if 'cp -R writing dist/writing' not in build:
              build = build.replace('cp index.html dist/index.html\n', 'cp index.html dist/index.html\ncp -R writing dist/writing\n', 1)
              build_path.write_text(build, encoding='utf-8')

          validate_path = Path('scripts/validate-site.sh')
          validate = validate_path.read_text(encoding='utf-8')
          if 'dist/writing/index.html' not in validate:
              anchor = 'cmp -s index.html dist/index.html\n'
              addition = '''cmp -s index.html dist/index.html\ntest -s dist/writing/index.html\ntest -s dist/writing/what-im-working-on-this-week/index.html\ncmp -s writing/index.html dist/writing/index.html\ncmp -s writing/what-im-working-on-this-week/index.html dist/writing/what-im-working-on-this-week/index.html\n'''
              if anchor not in validate:
                  raise SystemExit('Could not find validation insertion anchor')
              validate = validate.replace(anchor, addition, 1)
              validate_path.write_text(validate, encoding='utf-8')
          PY

          rm .github/workflows/publish-writing-post.yml
          bash scripts/build-site.sh
          bash scripts/validate-site.sh

      - name: Commit published post
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html writing scripts/build-site.sh scripts/validate-site.sh .github/workflows/publish-writing-post.yml
          git commit -m "Publish What I’m Working On This Week"
          git push origin master
